name: Build Catoons APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: ./gradlew :src:es:catmanhwas:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: catoons-apk
          path: '**/*.apk'
